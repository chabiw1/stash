name: Realtime update

on:
  schedule:
    - cron: '0 21 * * *'   # 04:00 Bangkok (UTC+7), after US market close (4 PM ET)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python src/build_html.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          BTC_ADDRESS: ${{ secrets.BTC_ADDRESS }}

      - run: python src/build_notion.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_HISTORY: ${{ secrets.NOTION_DB_HISTORY }}
          NOTION_DB_HOLDINGS: ${{ secrets.NOTION_DB_HOLDINGS }}
          NOTION_DB_CRYPTO: ${{ secrets.NOTION_DB_CRYPTO }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          BTC_ADDRESS: ${{ secrets.BTC_ADDRESS }}

      - name: Commit index.html and history.json
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add index.html data/history.json
          git diff --staged --quiet || git commit -m "update dashboard $(date -u)"
          git push
